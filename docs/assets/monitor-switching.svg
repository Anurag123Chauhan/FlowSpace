<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">FlowSpace switches one monitor at a time</title>
  <desc id="desc">An animated diagram shows Monitor 1 changing from Development to Design while Monitor 2 stays on Personal.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#121c33"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#18243c"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="url(#bg)"/>
  <text x="40" y="43" fill="#74d0ff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">ONE HOTKEY. ONE MONITOR.</text>
  <text x="40" y="78" fill="#f2f5fc" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Each display keeps its own workspace.</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(78 112)">
      <rect x="-5" y="-5" width="365" height="215" rx="18" fill="#080d1b"/>
      <rect width="355" height="205" rx="14" fill="#18223a"/><rect x="8" y="8" width="339" height="189" rx="10" fill="url(#panel)"/>
      <circle cx="26" cy="25" r="4" fill="#56c6ff"/><text x="40" y="31" fill="#f4f7ff" font-size="16" font-weight="700">MONITOR 1</text>
      <rect x="18" y="48" width="319" height="110" rx="9" fill="#17233a"><animate attributeName="fill" values="#17233a;#17233a;#233d62;#233d62;#17233a" keyTimes="0;.18;.25;.62;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="30" y="61" width="78" height="8" rx="4" fill="#56c6ff"><animate attributeName="fill" values="#56c6ff;#56c6ff;#a78bfa;#a78bfa;#56c6ff" keyTimes="0;.18;.25;.62;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="30" y="78" width="142" height="6" rx="3" fill="#394965"/><rect x="30" y="94" width="104" height="6" rx="3" fill="#293752"/>
      <text x="18" y="184" fill="#aab7ce" font-size="12" font-weight="700">DEVELOPMENT<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.18;.25;.62;1" dur="6s" repeatCount="indefinite"/></text>
      <text x="18" y="184" fill="#b9a7ff" font-size="12" font-weight="700" opacity="0">DESIGN<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.18;.25;.62;1" dur="6s" repeatCount="indefinite"/></text>
      <rect x="145" y="213" width="65" height="22" rx="6" fill="#26324b"/><rect x="112" y="233" width="130" height="6" rx="3" fill="#35435e"/>
    </g>
    <g transform="translate(526 112)">
      <rect x="-5" y="-5" width="365" height="215" rx="18" fill="#080d1b"/>
      <rect width="355" height="205" rx="14" fill="#18223a"/><rect x="8" y="8" width="339" height="189" rx="10" fill="url(#panel)"/>
      <circle cx="26" cy="25" r="4" fill="#41d6a3"/><text x="40" y="31" fill="#f4f7ff" font-size="16" font-weight="700">MONITOR 2</text>
      <rect x="18" y="48" width="319" height="110" rx="9" fill="#18213a"/>
      <rect x="30" y="61" width="78" height="8" rx="4" fill="#41d6a3"/><rect x="30" y="78" width="142" height="6" rx="3" fill="#394965"/><rect x="30" y="94" width="104" height="6" rx="3" fill="#293752"/>
      <text x="18" y="184" fill="#8fe0c2" font-size="12" font-weight="700">PERSONAL</text>
      <rect x="145" y="213" width="65" height="22" rx="6" fill="#26324b"/><rect x="112" y="233" width="130" height="6" rx="3" fill="#35435e"/>
    </g>
    <rect x="416" y="197" width="128" height="34" rx="17" fill="#23314b"/><text x="430" y="219" fill="#e3ecfc" font-size="13" font-weight="700">Ctrl + Alt + →</text>
    <text x="101" y="375" fill="#aab7ce" font-size="16" font-weight="700">Monitor 1 changes workspace<animate attributeName="fill" values="#aab7ce;#9ad8ff;#aab7ce" dur="6s" repeatCount="indefinite"/></text>
    <text x="548" y="375" fill="#8fe0c2" font-size="16" font-weight="700">Monitor 2 stays on Personal</text>
    <circle cx="875" cy="368" r="6" fill="#56c6ff" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
